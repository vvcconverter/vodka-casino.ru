    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var slot = document.getElementById("tag-slot");
            if (!slot) return;

            var params = new URLSearchParams(window.location.search);
            var id = (params.get("id") || "").trim();
            try { id = decodeURIComponent(id); } catch (e) {}

            var tags = Array.isArray(window.SITE_TAGS) ? window.SITE_TAGS : [];
            var name = "";

            if (id) {
                var idLower = id.toLowerCase();
                var found = tags.find(function (t) {
                    var slug = String(t.slug || "");
                    var n = String(t.name || "");
                    return slug === id || n === id ||
                        slug.toLowerCase() === idLower ||
                        n.toLowerCase() === idLower;
                });
                name = found ? found.name : id;
            } else if (tags.length) {
                name = tags[Math.floor(Math.random() * tags.length)].name;
            }

            if (name) {
                slot.textContent = name;
                document.title = name + " — vodka.bet";
            }

            var meta = document.querySelector('meta[name="keywords"]');
            if (meta && tags.length) {
                meta.setAttribute("content", tags.map(function (t) { return t.name; }).join(", "));
            }

            var logo = document.getElementById("logo-nav");
            if (logo) {
                logo.addEventListener("click", function () {
                    var stepKey = "vodka-logo-step";
                    var idxKey = "vodka-tag-i";
                    var step = parseInt(sessionStorage.getItem(stepKey) || "0", 10);

                    if (step < 1) {
                        sessionStorage.setItem(stepKey, "1");
                        sessionStorage.setItem(idxKey, "0");
                        window.location.href = "/";
                        return;
                    }

                    var list = Array.isArray(window.SITE_TAGS) ? window.SITE_TAGS : tags;
                    if (!list.length) {
                        window.location.href = "/";
                        return;
                    }

                    var i = parseInt(sessionStorage.getItem(idxKey) || "0", 10);
                    if (isNaN(i) || i < 0) i = 0;
                    var tag = list[i % list.length];
                    var slug = tag.slug || tag.name;
                    sessionStorage.setItem(idxKey, String(i + 1));
                    window.location.href = "/?id=" + encodeURIComponent(slug);
                });
            }
        });
